services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: love-backend
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    container_name: love-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  backend-data:
